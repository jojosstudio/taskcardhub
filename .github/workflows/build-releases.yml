name: Build Release APK & Unsigned IPA

on:
  push:
    branches:
      - main # Der Workflow startet automatisch bei einem Push in den Main-Branch
  workflow_dispatch: # Ermöglicht auch das manuelle Starten über GitHub

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get
        working-directory: taskcard-hub-flutter

      - name: Build Release APK
        run: flutter build apk --release
        working-directory: taskcard-hub-flutter

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: taskcard-hub-flutter/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build Unsigned iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get
        working-directory: taskcard-hub-flutter

      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign
        working-directory: taskcard-hub-flutter

      - name: Archive iOS Build Output
        run: |
          cd taskcard-hub-flutter/build/ios/iphoneos
          zip -r TaskcardHub-unsigned-ios.zip Runner.app

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-ios
          path: taskcard-hub-flutter/build/ios/iphoneos/TaskcardHub-unsigned-ios.zip